name: LBT CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - fix/lbt-social-ux-and-reel-interactions

permissions:
  contents: read

concurrency:
  group: lbt-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-typecheck-and-build:
    name: TypeScript check and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run lint

      - name: Build frontend and server
        run: npm run build

      - name: Verify build output
        run: |
          test -s dist/index.html
          test -s dist/server.cjs
