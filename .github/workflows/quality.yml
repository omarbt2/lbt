name: LBT quality checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/lbt-social-ux-and-reel-interactions, fix/lbt-central-create-repost-reels-settings-20261123]

permissions:
  contents: read

# The Supabase publishable key is intended for client-side apps.
# Never put a service_role or secret key in this workflow.
env:
  VITE_SUPABASE_URL: https://nopnxlhknrrsttouevxd.supabase.co
  VITE_SUPABASE_ANON_KEY: sb_publishable_0KwbT8dKkAqhFTXMwXw_9w_KSwIIi6C

concurrency:
  group: lbt-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency security audit
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const r=require('./npm-audit.json'); const v=r.metadata?.vulnerabilities || {}; console.log('npm audit summary:', JSON.stringify(v)); for (const [name, issue] of Object.entries(r.vulnerabilities || {})) console.log(name + ': severity=' + issue.severity + ', direct=' + issue.isDirect + ', fix=' + JSON.stringify(issue.fixAvailable)); if ((v.total || 0) > 0) process.exit(1);"

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Smoke test production server and AI authentication gate
        run: |
          NODE_ENV=production node dist/server.cjs > /tmp/lbt-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/api/health > /tmp/lbt-health.json; then
              break
            fi
            sleep 1
          done
          node -e "const h=require('/tmp/lbt-health.json'); if (h.status !== 'ok') process.exit(1);"
          curl -fsS http://127.0.0.1:3000/ > /dev/null
          status=$(curl -sS -o /tmp/lbt-ai-response.json -w '%{http_code}' -X POST http://127.0.0.1:3000/api/ai/suggest-tags -H 'Content-Type: application/json' -d '{"caption":"hello"}')
          test "$status" = "401"

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install locked dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build Android debug APK
        working-directory: android
        run: bash ./gradlew assembleDebug --no-daemon

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lbt-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
